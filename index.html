<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>프랭클린 플래너</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">프랭클린 플래너</div>
    <nav class="tabs" id="tabs" hidden>
      <button data-tab="day" class="active">하루 정리</button>
      <button data-tab="notebook">기록 수첩</button>
    </nav>
    <div class="account" id="account"></div>
  </header>

  <main id="login" class="login" hidden>
    <div class="login-card">
      <h1>프랭클린 플래너</h1>
      <p>폰 앱에서 쓰던 할 일, 일정, 기록, 하루 반성을 PC에서 보고 정리합니다.</p>
      <p class="muted">폰 앱의 ⋮ → PC 동기화에서 로그인한 구글 계정과 같은 계정으로 로그인하세요.</p>
      <button id="signin" class="primary">구글로 로그인</button>
      <p id="login-error" class="error"></p>
    </div>
  </main>

  <main id="loading" class="loading">불러오는 중…</main>

  <main id="day-view" class="day" hidden>
    <section class="datebar">
      <button id="prev" title="이전 날">◀</button>
      <div class="datetitle">
        <div id="date-label"></div>
        <input type="date" id="date-input">
      </div>
      <button id="next" title="다음 날">▶</button>
      <button id="today" class="ghost">오늘</button>
      <span id="summary" class="summary"></span>
    </section>

    <div class="columns">
      <div class="col">
        <section class="card">
          <div class="card-head">
            <h2>우선순위 업무 목록</h2>
            <button id="forward-all" class="ghost small" title="미완료 일을 다음 날로 이월">못 한 일 다음 날로 →</button>
          </div>
          <p class="hint">A 반드시 · B 해야 할 · C 하면 좋은 일 &nbsp;|&nbsp; 왼쪽 칸을 눌러 완료, 오른쪽 메뉴로 상태·이월</p>
          <div id="tasks"></div>
          <form id="task-form" class="addrow">
            <select id="task-p"><option>A</option><option>B</option><option>C</option></select>
            <input id="task-text" placeholder="할 일 추가 (Enter)" autocomplete="off">
            <button class="primary small">추가</button>
          </form>
        </section>

        <section class="card">
          <h2>일정</h2>
          <div id="appts"></div>
          <form id="appt-form" class="addrow">
            <input type="time" id="appt-time" required>
            <input id="appt-title" placeholder="일정 추가 (Enter)" autocomplete="off">
            <button class="primary small">추가</button>
          </form>
        </section>

        <section class="card" id="week-card">
          <h2>이번 주 목표</h2>
          <div id="week-goals"></div>
        </section>
      </div>

      <div class="col">
        <section class="card">
          <div class="card-head">
            <h2>일일 기록</h2>
            <button id="note-toggle" class="ghost small">편집</button>
          </div>
          <div id="note-view" class="note"></div>
          <div id="note-edit" hidden>
            <div class="toolbar">
              <button data-insert="☐ " class="ghost small">☐ 체크 항목</button>
              <button data-insert="• " class="ghost small">• 글머리</button>
              <button data-insert="time" class="ghost small">지금 시각</button>
            </div>
            <textarea id="note-text" rows="14" placeholder="회의 내용, 지시사항, 메모 …&#10;☐ 로 시작하는 줄은 나중에 체크할 수 있습니다."></textarea>
          </div>
          <p class="hint">사진·동영상은 폰 앱에서만 볼 수 있습니다.</p>
        </section>

        <section class="card">
          <h2>하루 반성</h2>
          <label>잘한 점 · 감사한 일<textarea data-refl="good" rows="3"></textarea></label>
          <label>아쉬운 점 · 배운 점<textarea data-refl="improve" rows="3"></textarea></label>
          <label>내일을 위해<textarea data-refl="tomorrow" rows="3"></textarea></label>
          <p id="save-state" class="hint"></p>
        </section>
      </div>
    </div>
  </main>

  <main id="notebook-view" class="notebook" hidden>
    <section class="nb-bar">
      <input id="nb-search" placeholder="기록 검색 (사람, 회의, 지시사항 …)">
      <button id="nb-all" class="chip active">전체</button>
      <button id="nb-open" class="chip">확인 안 한 항목</button>
    </section>
    <div id="nb-list"></div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
